<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>過積載防止・積み込み管理アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        /* Pulse Animation for Overload Warning */
        @keyframes alert-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.02); }
        }
        .animate-overload {
            animation: alert-pulse 1s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 select-none">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-truck-ramp-box text-amber-500 text-xl"></i>
                <div class="flex items-baseline gap-2">
                    <h1 class="font-bold text-base tracking-wide text-white">過積載Guard Pro</h1>
                    <span class="text-[10px] text-slate-400 font-semibold tracking-tight">Presented by Nakamura</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleAudio()" id="soundToggleBtn" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-2.5 py-1.5 rounded-lg border border-slate-600 flex items-center gap-1.5 transition">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-amber-400"></i>
                    <span id="soundText" class="font-bold">ON</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-3 pt-3">
        
        <!-- Navigation Tabs -->
        <nav class="flex bg-slate-800/90 p-1 rounded-xl border border-slate-700/80 mb-4 shadow-sm">
            <button onclick="switchTab('loadTab')" id="nav-loadTab" class="tab-btn flex-1 py-2.5 text-xs font-bold rounded-lg transition-all text-amber-400 bg-slate-700 shadow-sm flex justify-center items-center gap-1.5">
                <i class="fa-solid fa-weight-hanging"></i> 積み込み作業
            </button>
            <button onclick="switchTab('historyTab')" id="nav-historyTab" class="tab-btn flex-1 py-2.5 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200 flex justify-center items-center gap-1.5">
                <i class="fa-solid fa-clock-rotate-left"></i> 作業履歴
            </button>
            <button onclick="switchTab('masterTab')" id="nav-masterTab" class="tab-btn flex-1 py-2.5 text-xs font-bold rounded-lg transition-all text-slate-400 hover:text-slate-200 flex justify-center items-center gap-1.5">
                <i class="fa-solid fa-sliders"></i> マスタ設定
            </button>
        </nav>

        <!-- ================= TAB 1: LOADING & MEASUREMENT ================= -->
        <section id="loadTab" class="tab-content space-y-4">
            
            <!-- Truck & Driver Selection Card -->
            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 shadow-sm space-y-3">
                <div class="flex justify-between items-center border-b border-slate-700/80 pb-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-truck text-amber-500"></i> 作業トラック・担当者設定
                    </span>
                    <button onclick="switchTab('masterTab')" class="text-[11px] text-amber-400 hover:underline flex items-center gap-1 font-semibold">
                        <i class="fa-solid fa-plus-circle"></i> マスタ編集
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-xs text-slate-300 font-semibold mb-1">使用するトラックの選択</label>
                        <select id="truckSelect" onchange="onTruckSelectChange()" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-amber-500">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 font-semibold mb-1">作業担当者・ドライバー</label>
                        <select id="driverSelect" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm font-semibold text-white focus:outline-none focus:border-amber-500">
                            <!-- Populated by JS -->
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3 pt-1">
                    <div>
                        <label class="block text-[11px] text-slate-400">車両番号 / ナンバー</label>
                        <input type="text" id="truckPlate" readonly class="w-full bg-slate-900/60 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-300 font-mono mt-1 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-[11px] text-amber-400 font-bold">今回の最大積載量 (kg)</label>
                        <input type="number" id="maxWeightInput" step="10" min="0" onchange="updateMaxWeight(this.value)" class="w-full bg-slate-900 border-2 border-amber-500/80 rounded-xl px-3 py-2 text-sm text-amber-300 font-black font-mono mt-1 text-right focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>
            </div>

            <!-- Overload Gauge & Visual Alert Display -->
            <div id="gaugeCard" class="bg-slate-800 rounded-2xl p-4 border border-slate-700 shadow-lg text-center transition-all duration-300">
                <div class="flex justify-between items-center text-xs text-slate-400 font-semibold mb-1">
                    <span>積載ステータス</span>
                    <span id="loadPercentage" class="font-mono text-sm font-bold text-white">0%</span>
                </div>

                <!-- Weight Progress Bar -->
                <div class="w-full bg-slate-900 rounded-full h-5 overflow-hidden border border-slate-700 p-0.5 mb-3">
                    <div id="progressBar" class="bg-emerald-500 h-full rounded-full transition-all duration-300 w-0"></div>
                </div>

                <div class="grid grid-cols-3 gap-2 mb-2 border-b border-slate-700/60 pb-3">
                    <div class="text-left flex flex-col justify-between">
                        <span class="text-[9px] uppercase tracking-wider text-slate-400 block font-semibold">現在の積載重量</span>
                        <div class="text-2xl font-black font-mono text-white tracking-tight my-1">
                            <span id="currentWeightDisplay">0</span> <span class="text-[10px] font-normal text-slate-400">kg</span>
                        </div>
                        <span class="text-[11px] text-slate-300 font-bold block">合計積載 <span id="totalCountDisplay" class="font-extrabold text-amber-400 text-sm">0</span> 個</span>
                    </div>
                    <div class="text-center flex flex-col justify-between border-x border-slate-700/50 px-1">
                        <span class="text-[9px] uppercase tracking-wider text-amber-400 block font-semibold">平均重量</span>
                        <div class="text-2xl font-black font-mono text-amber-300 tracking-tight my-1">
                            <span id="averageWeightDisplay">0</span> <span class="text-[10px] font-normal text-slate-400">kg</span>
                        </div>
                        <span class="text-[10px] text-slate-400 font-semibold block">1個あたりの平均</span>
                    </div>
                    <div class="text-right flex flex-col justify-between">
                        <span class="text-[9px] uppercase tracking-wider text-cyan-400 block font-semibold">残り積込可能数量</span>
                        <div class="text-2xl font-black font-mono text-cyan-300 tracking-tight my-1">
                            <span id="remainingCountDisplay">0</span> <span class="text-[10px] font-normal text-slate-400">個</span>
                        </div>
                        <span class="text-[11px] text-slate-300 font-bold block">予定積込数量 <span id="plannedTotalCountDisplay" class="font-extrabold text-cyan-400 text-sm">0</span> 個</span>
                    </div>
                </div>

                <!-- Dynamic Alert Banner -->
                <div id="alertBanner" class="mt-2 py-2 px-3 rounded-xl text-xs font-bold border flex items-center justify-center gap-2 bg-slate-900/80 border-slate-700 text-slate-300">
                    <i class="fa-solid fa-circle-check text-emerald-400"></i>
                    <span id="alertText">積み込み作業を開始してください</span>
                </div>
            </div>

            <!-- Item Input Form (Preserves selection after adding) -->
            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 shadow-sm space-y-3">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5 border-b border-slate-700/80 pb-2">
                    <i class="fa-solid fa-box text-amber-500"></i> 荷物の計量・追加
                </span>

                <!-- Quick Select from Registered Master Items -->
                <div>
                    <label class="block text-xs text-slate-300 font-semibold mb-1">事前登録荷物から選択</label>
                    <select id="itemSelect" onchange="onItemSelectChange()" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                        <!-- Populated by JS -->
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-xs text-slate-300 font-semibold mb-1">品名 / 荷物の種類</label>
                        <input type="text" id="inputItemName" placeholder="例: 段ボール" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-300 font-semibold mb-1">単体重量 (kg)</label>
                        <input type="number" id="inputItemWeight" step="1" min="0" placeholder="0" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-xs font-mono text-white text-right focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <!-- Counter Control Button Group -->
                <div class="flex items-center gap-2 pt-1">
                    <div class="flex-1 bg-slate-900 border border-slate-600 rounded-xl flex items-center justify-between p-1">
                        <button type="button" onclick="adjustCount(-1)" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-bold text-lg flex items-center justify-center active:scale-95 transition">-</button>
                        <div class="text-center">
                            <span class="block text-[9px] text-slate-400 font-bold">数量</span>
                            <input type="number" id="inputItemCount" value="1" min="1" step="1" class="w-12 bg-transparent text-center font-bold font-mono text-base text-amber-300 focus:outline-none">
                        </div>
                        <button type="button" onclick="adjustCount(1)" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-white rounded-lg font-bold text-lg flex items-center justify-center active:scale-95 transition">+</button>
                    </div>

                    <button type="button" onclick="addItemToLoad()" class="flex-1 h-12 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-black text-sm rounded-xl shadow-lg flex items-center justify-center gap-2 transition active:scale-95">
                        <i class="fa-solid fa-plus text-base"></i> リストに追加
                    </button>
                </div>
            </div>

            <!-- Loaded Items List -->
            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 shadow-sm space-y-3">
                <div class="flex justify-between items-center border-b border-slate-700/80 pb-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-list-check text-amber-500"></i> 積載済み荷物一覧
                    </span>
                    <button onclick="clearAllLoadedItems()" class="text-[11px] text-rose-400 hover:underline flex items-center gap-1">
                        <i class="fa-solid fa-trash-can"></i> 全削除
                    </button>
                </div>

                <div id="loadedItemList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
                    <!-- Dynamic Item List -->
                </div>

                <div class="pt-2">
                    <button onclick="saveLoadingSession()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-lg flex items-center justify-center gap-2 transition active:scale-95">
                        <i class="fa-solid fa-floppy-disk"></i> 積み込み完了・保存
                    </button>
                </div>
            </div>
        </section>

        <!-- ================= TAB 2: WORK HISTORY ================= -->
        <section id="historyTab" class="tab-content hidden space-y-4">
            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 shadow-sm space-y-3">
                <div class="flex justify-between items-center border-b border-slate-700/80 pb-2">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5">
                        <i class="fa-solid fa-file-invoice text-amber-500"></i> 作業保存履歴
                    </span>
                    <button onclick="exportHistoryCSV()" class="text-xs bg-slate-700 hover:bg-slate-600 text-emerald-400 px-2.5 py-1.5 rounded-lg border border-slate-600 flex items-center gap-1 font-bold transition">
                        <i class="fa-solid fa-file-csv"></i> CSV出力
                    </button>
                </div>

                <!-- History Filter Search Input -->
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
                    <input type="text" id="historySearchInput" oninput="renderHistoryList()" placeholder="トラック名・担当者・日付で絞り込み..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-8 pr-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-amber-500">
                </div>

                <!-- History Records List Container -->
                <div id="historyListContainer" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                    <!-- Dynamic History Records -->
                </div>
            </div>
        </section>

        <!-- ================= TAB 3: MASTER REGISTRATION ================= -->
        <section id="masterTab" class="tab-content hidden space-y-5">
            
            <!-- Driver Master Form & List -->
            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 space-y-3 shadow-sm">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5 border-b border-slate-700/80 pb-2">
                    <i class="fa-solid fa-user-gear text-amber-500"></i> 担当者マスタ登録
                </h3>
                <div class="flex gap-2">
                    <input type="text" id="newDriverName" placeholder="担当者氏名 (例: 山口 春樹)" class="flex-1 bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                    <button onclick="addDriverMaster()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-amber-400 font-bold text-xs rounded-xl flex items-center justify-center gap-1 transition active:scale-95 whitespace-nowrap">
                        <i class="fa-solid fa-plus"></i> 登録
                    </button>
                </div>
                <div class="pt-1">
                    <span class="text-[11px] text-slate-400 font-bold block mb-1">登録済み担当者一覧</span>
                    <div id="driverMasterList" class="space-y-1.5 max-h-32 overflow-y-auto">
                        <!-- Dynamic Driver List -->
                    </div>
                </div>
            </div>

            <!-- Truck Master Form & List -->
            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 space-y-3 shadow-sm">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5 border-b border-slate-700/80 pb-2">
                    <i class="fa-solid fa-truck-gear text-amber-500"></i> トラックマスタ登録
                </h3>
                <div class="grid grid-cols-1 gap-2.5">
                    <input type="text" id="newTruckName" placeholder="トラック名 (例: 3.5t ユニック)" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="newTruckPlate" placeholder="ナンバー (例: 沖縄100 あ 48-63)" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                        <input type="number" id="newTruckMaxWeight" step="10" min="0" placeholder="標準積載量(kg)" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-xs font-mono text-white text-right focus:outline-none focus:border-amber-500">
                    </div>
                    <button onclick="addTruckMaster()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-amber-400 font-bold text-xs rounded-xl flex items-center justify-center gap-1 transition active:scale-95">
                        <i class="fa-solid fa-plus"></i> トラックマスタ追加
                    </button>
                </div>
                <div class="pt-1">
                    <span class="text-[11px] text-slate-400 font-bold block mb-1">登録済みトラック一覧</span>
                    <div id="truckMasterList" class="space-y-1.5 max-h-36 overflow-y-auto">
                        <!-- Dynamic Truck Master List -->
                    </div>
                </div>
            </div>

            <!-- Item Master Form & List -->
            <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 space-y-3 shadow-sm">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-1.5 border-b border-slate-700/80 pb-2">
                    <i class="fa-solid fa-boxes-packing text-amber-500"></i> 荷物マスタ登録
                </h3>
                <div class="grid grid-cols-1 gap-2.5">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="newItemName" placeholder="品名 (例: フレコンバック)" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-amber-500">
                        <input type="number" id="newItemDefaultWeight" step="1" min="0" placeholder="標準重量(kg)" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-xs font-mono text-white text-right focus:outline-none focus:border-amber-500">
                    </div>
                    <button onclick="addItemMaster()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 text-amber-400 font-bold text-xs rounded-xl flex items-center justify-center gap-1 transition active:scale-95">
                        <i class="fa-solid fa-plus"></i> 荷物マスタ追加
                    </button>
                </div>
                <div class="pt-1">
                    <span class="text-[11px] text-slate-400 font-bold block mb-1">登録済み荷物一覧</span>
                    <div id="itemMasterList" class="space-y-1.5 max-h-36 overflow-y-auto">
                        <!-- Dynamic Item Master List -->
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Custom Modal Dialog -->
    <div id="customModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 max-w-xs w-full text-center space-y-4 shadow-2xl">
            <div id="modalIconContainer" class="w-12 h-12 rounded-full mx-auto flex items-center justify-center bg-slate-700 text-2xl">
                <i id="modalIcon" class="fa-solid fa-circle-info text-amber-400"></i>
            </div>
            <div>
                <h3 id="modalTitle" class="font-bold text-white text-base mb-1">通知</h3>
                <div id="modalMessage" class="text-xs text-slate-300 leading-relaxed">メッセージが入ります</div>
            </div>
            <button onclick="closeModal()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl active:scale-95 transition">
                OK
            </button>
        </div>
    </div>

    <!-- Application JavaScript -->
    <script>
        // Storage Keys
        const STORAGE_KEYS = {
            TRUCKS: 'load_app_trucks_v4',
            ITEMS: 'load_app_items_v4',
            DRIVERS: 'load_app_drivers_v4',
            HISTORY: 'load_app_history_v4'
        };

        // Default Masters
        const DEFAULT_TRUCKS = [
            { id: 't1', name: '3.5t ユニック', plate: '沖縄 100 あ 48-63', maxWeight: 3500 },
            { id: 't2', name: '11.8t ユニック', plate: '沖縄 100 は 63-46', maxWeight: 11800 },
            { id: 't3', name: '20t トレーラー', plate: '沖縄 100 え 33-64', maxWeight: 20000 },
            { id: 't4', name: '20t トレーラー', plate: '沖縄 100 え 33-65', maxWeight: 20000 },
            { id: 't5', name: '20t トレーラー', plate: '沖縄 100 え 33-67', maxWeight: 20000 }
        ];

        const DEFAULT_ITEMS = [
            { id: 'i1', name: 'フレコンバック ', defaultWeight: 500 },
            { id: 'i2', name: 'ドラム缶 ', defaultWeight: 200 },
            { id: 'i3', name: '木製パレット ', defaultWeight: 25 },
            { id: 'i4', name: '段ボール ', defaultWeight: 15 }
        ];

        const DEFAULT_DRIVERS = [
            { id: 'd1', name: '山口　春樹' },
            { id: 'd2', name: '國吉　真博' },
            { id: 'd3', name: '國吉　巨樹' },
            { id: 'd4', name: '阿嘉　祐和' },
            { id: 'd5', name: '與那　輝明' },
            { id: 'd6', name: '天久　貴広' },
            { id: 'd7', name: '川﨑　法幸' }
        ];

        // Global Active Session State
        let trucks = [];
        let itemMasters = [];
        let driverMasters = [];
        let historyRecords = [];

        let currentSelectedTruck = null;
        let activeMaxWeight = 0;
        let loadedItems = []; 
        let soundEnabled = true;
        let audioContext = null;

        // Initialize Application
        window.onload = function() {
            loadLocalStorageData();
            initTruckSelect();
            initItemSelect();
            initDriverSelect();
            renderLoadedItems();
            updateGauge();
            renderMasterLists();
            renderHistoryList();
        };

        // Global Tab Switching Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-amber-400', 'bg-slate-700', 'shadow-sm');
                btn.classList.add('text-slate-400');
            });

            const targetTab = document.getElementById(tabId);
            const targetBtn = document.getElementById('nav-' + tabId);

            if (targetTab) targetTab.classList.remove('hidden');
            if (targetBtn) {
                targetBtn.classList.add('text-amber-400', 'bg-slate-700', 'shadow-sm');
                targetBtn.classList.remove('text-slate-400');
            }

            if (tabId === 'historyTab') renderHistoryList();
            if (tabId === 'masterTab') renderMasterLists();
        }

        // Local Storage Utilities
        function loadLocalStorageData() {
            try {
                const storedTrucks = localStorage.getItem(STORAGE_KEYS.TRUCKS);
                trucks = (storedTrucks && JSON.parse(storedTrucks).length > 0) ? JSON.parse(storedTrucks) : [...DEFAULT_TRUCKS];

                const storedItems = localStorage.getItem(STORAGE_KEYS.ITEMS);
                itemMasters = (storedItems && JSON.parse(storedItems).length > 0) ? JSON.parse(storedItems) : [...DEFAULT_ITEMS];

                const storedDrivers = localStorage.getItem(STORAGE_KEYS.DRIVERS);
                driverMasters = (storedDrivers && JSON.parse(storedDrivers).length > 0) ? JSON.parse(storedDrivers) : [...DEFAULT_DRIVERS];

                const storedHistory = localStorage.getItem(STORAGE_KEYS.HISTORY);
                historyRecords = storedHistory ? JSON.parse(storedHistory) : [];
            } catch (e) {
                trucks = [...DEFAULT_TRUCKS];
                itemMasters = [...DEFAULT_ITEMS];
                driverMasters = [...DEFAULT_DRIVERS];
                historyRecords = [];
            }
        }

        function saveTrucks() { localStorage.setItem(STORAGE_KEYS.TRUCKS, JSON.stringify(trucks)); }
        function saveItems() { localStorage.setItem(STORAGE_KEYS.ITEMS, JSON.stringify(itemMasters)); }
        function saveDrivers() { localStorage.setItem(STORAGE_KEYS.DRIVERS, JSON.stringify(driverMasters)); }
        function saveHistory() { localStorage.setItem(STORAGE_KEYS.HISTORY, JSON.stringify(historyRecords)); }

        // Select Initializers
        function initTruckSelect() {
            const select = document.getElementById('truckSelect');
            if (!select) return;

        function initItemSelect() {

            itemMasters.forEach(i => {

        function initDriverSelect() {

        // Change Handlers
        function onTruckSelectChange() {
            const truckId = document.getElementById('truckSelect').value;
            currentSelectedTruck = trucks.find(t => t.id === truckId) || null;

            if (currentSelectedTruck) {
                document.getElementById('truckPlate').value = currentSelectedTruck.plate || '未設定';
                activeMaxWeight = Math.floor(currentSelectedTruck.maxWeight || 0);
                document.getElementById('maxWeightInput').value = activeMaxWeight;
            } else {
                document.getElementById('truckPlate').value = '';
                activeMaxWeight = 0;
                document.getElementById('maxWeightInput').value = '';
            }
            updateGauge();
        }

        function onItemSelectChange() {
            const itemId = document.getElementById('itemSelect').value;
            const selectedItem = itemMasters.find(i => i.id === itemId);

            if (selectedItem) {
                document.getElementById('inputItemName').value = selectedItem.name;
                document.getElementById('inputItemWeight').value = Math.floor(selectedItem.defaultWeight || 0);
            }
        }

        function updateMaxWeight(val) {
            const weight = parseInt(val, 10);
            activeMaxWeight = isNaN(weight) || weight < 0 ? 0 : Math.floor(weight);
            updateGauge();
        }

        function adjustCount(delta) {
            const input = document.getElementById('inputItemCount');
            let current = parseInt(input.value, 10) || 1;
            current += delta;
            if (current < 1) current = 1;
            input.value = current;

        // Load Items Action (PRESERVES SELECTION)
        function addItemToLoad() {
            const nameInput = document.getElementById('inputItemName');
            const weightInput = document.getElementById('inputItemWeight');
            const countInput = document.getElementById('inputItemCount');

            const name = nameInput.value.trim();
            const unitWeight = Math.floor(parseInt(weightInput.value, 10) || 0);
            const count = parseInt(countInput.value, 10) || 1;

            if (!name) {
                showCustomModal('入力エラー', '品名 / 荷物の種類を入力してください。', 'fa-triangle-exclamation', 'text-amber-400');
                return;
            }
            if (unitWeight <= 0) {
                showCustomModal('入力エラー', '有効な単体重量 (1kg以上) を入力してください。', 'fa-triangle-exclamation', 'text-amber-400');
                return;
            }

            const totalWeight = unitWeight * count;

            loadedItems.unshift({
                id: 'item_' + Date.now(),
                name: name,
                unitWeight: unitWeight,
                count: count,
                totalWeight: totalWeight
            });

            // Reset count to 1, preserve name, unit weight and select box selection
            countInput.value = 1;

            renderLoadedItems();
            updateGauge();
        }

        // Calculation & Alert Logic
        function updateGauge() {
            const totalWeight = loadedItems.reduce((sum, item) => sum + item.totalWeight, 0);
            const totalCount = loadedItems.reduce((sum, item) => sum + item.count, 0);
            const avgWeight = totalCount > 0 ? Math.round(totalWeight / totalCount) : 0;
            const remaining = activeMaxWeight - totalWeight;
            const percentage = activeMaxWeight > 0 ? Math.min(Math.round((totalWeight / activeMaxWeight) * 100), 999) : 0;

            let remainingCountNum = 0;
            let remainingCountDisplay = '-';
            if (avgWeight > 0 && remaining > 0) {
                remainingCountNum = Math.floor(remaining / avgWeight);
                remainingCountDisplay = remainingCountNum.toLocaleString();
            } else if (remaining <= 0) {
                remainingCountNum = 0;
                remainingCountDisplay = '0';
            }

            const plannedTotalCount = totalCount + remainingCountNum;

            document.getElementById('currentWeightDisplay').textContent = totalWeight.toLocaleString();
            document.getElementById('averageWeightDisplay').textContent = avgWeight.toLocaleString();
            document.getElementById('totalCountDisplay').textContent = totalCount.toLocaleString();
            document.getElementById('remainingCountDisplay').textContent = remainingCountDisplay;
            document.getElementById('plannedTotalCountDisplay').textContent = (avgWeight > 0 || totalCount > 0) ? plannedTotalCount.toLocaleString() : '-';
            document.getElementById('loadPercentage').textContent = `${percentage}%`;

            const progressBar = document.getElementById('progressBar');
            const alertBanner = document.getElementById('alertBanner');
            const alertText = document.getElementById('alertText');
            const gaugeCard = document.getElementById('gaugeCard');

            progressBar.style.width = `${Math.min(percentage, 100)}%`;

            if (activeMaxWeight === 0) {
                progressBar.className = 'bg-slate-600 h-full rounded-full transition-all duration-300';
                alertBanner.className = 'mt-2 py-2 px-3 rounded-xl text-xs font-bold border flex items-center justify-center gap-2 bg-slate-900/80 border-slate-700 text-slate-400';
                alertBanner.innerHTML = '<i class="fa-solid fa-circle-info"></i> トラックまたは最大積載量を設定してください';
                gaugeCard.classList.remove('border-rose-500', 'border-amber-500', 'animate-overload');
                return;
            }

            if (totalWeight > activeMaxWeight) {
                // OVERLOAD WARNING (100% Over)
                progressBar.className = 'bg-rose-600 h-full rounded-full transition-all duration-300';
                alertBanner.className = 'mt-2 py-2 px-3 rounded-xl text-xs font-bold border flex items-center justify-center gap-2 bg-rose-950/90 border-rose-600 text-rose-300 animate-pulse';
                alertBanner.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-400 text-sm"></i> 過積載危険！上限を ${Math.abs(remaining).toLocaleString()} kg 超過しています`;
                gaugeCard.classList.add('border-rose-500', 'animate-overload');
                playBeepSound('danger');
            } else if (percentage >= 80) {
                // WARNING STAGE (80%-99%)
                progressBar.className = 'bg-amber-500 h-full rounded-full transition-all duration-300';
                alertBanner.className = 'mt-2 py-2 px-3 rounded-xl text-xs font-bold border flex items-center justify-center gap-2 bg-amber-950/80 border-amber-600 text-amber-300';
                alertBanner.innerHTML = `<i class="fa-solid fa-circle-exclamation text-amber-400"></i> 積載率80%超過。残り上限 ${remaining.toLocaleString()} kg です`;
                gaugeCard.classList.remove('border-rose-500', 'animate-overload');
                gaugeCard.classList.add('border-amber-500');
                playBeepSound('warning');
            } else {
                // NORMAL SAFE STAGE
                progressBar.className = 'bg-emerald-500 h-full rounded-full transition-all duration-300';
                alertBanner.className = 'mt-2 py-2 px-3 rounded-xl text-xs font-bold border flex items-center justify-center gap-2 bg-emerald-950/60 border-emerald-700/60 text-emerald-300';
                alertBanner.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i> 適正範囲内です (残り ${remaining.toLocaleString()} kg)`;
                gaugeCard.classList.remove('border-rose-500', 'border-amber-500', 'animate-overload');
            }
        }

        // Beep Alarm & Warning Sound Generator
        function playBeepSound(type = 'danger') {
            if (!soundEnabled) return;
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                if (type === 'warning') {
                    // 80%超過時の注意音 (ピピッ音: 高い2音のソフトなブザー)
                    const now = audioContext.currentTime;
                    const osc1 = audioContext.createOscillator();
                    const gain1 = audioContext.createGain();

                    osc1.type = 'sine';
                    osc1.frequency.setValueAtTime(660, now); // 1音目 (E5)
                    osc1.frequency.setValueAtTime(880, now + 0.08); // 2音目 (A5)

                    gain1.gain.setValueAtTime(0.12, now);
                    gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

                    osc1.connect(gain1);
                    gain1.connect(audioContext.destination);

                    osc1.start(now);
                    osc1.stop(now + 0.2);
                } else {
                    // 過積載(100%超)の危険アラーム音 (低く強めの鋸歯状波)
                    const now = audioContext.currentTime;
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, now);
                    gain.gain.setValueAtTime(0.15, now);

                    osc.connect(gain);
                    gain.connect(audioContext.destination);

                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch(e) {}
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');

            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-amber-400';
                text.textContent = 'ON';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-slate-500';

        }

        // Save Completed Loading Session
        function saveLoadingSession() {
            if (loadedItems.length === 0) {
                showCustomModal('保存不可', '積載された荷物がありません。荷物を追加してから保存してください。', 'fa-circle-info', 'text-amber-400');
                return;
            }

            const driverSelectEl = document.getElementById('driverSelect');
            const selectedDriverId = driverSelectEl ? driverSelectEl.value : '';
            const selectedDriver = driverMasters.find(d => d.id === selectedDriverId);
            const driverName = selectedDriver ? selectedDriver.name : '未指定';

            const totalWeight = loadedItems.reduce((sum, i) => sum + i.totalWeight, 0);
            const isOverloaded = totalWeight > activeMaxWeight;

            const newRecord = {
                id: 'rec_' + Date.now(),
                timestamp: new Date().toLocaleString('ja-JP'),
                truckName: currentSelectedTruck ? currentSelectedTruck.name : '未指定トラック',
                truckPlate: currentSelectedTruck ? currentSelectedTruck.plate : '',
                driverName: driverName,
                maxWeight: activeMaxWeight,
                totalWeight: totalWeight,
                loadRate: activeMaxWeight > 0 ? Math.floor((totalWeight / activeMaxWeight) * 100) : 0,
                isOverloaded: isOverloaded,
                items: [...loadedItems]
            };

            historyRecords.unshift(newRecord);
            saveHistory();

            // Clear Session Loaded items
            loadedItems = [];
            renderLoadedItems();
            updateGauge();

            const successHtml = `
                積み込み作業記録を正常に保存しました。<br>
                <span class="block mt-2 text-sm font-bold text-amber-300">お疲れ様でした！</span>
            `;
            showCustomModal('保存完了', successHtml, 'fa-circle-check', 'text-emerald-400');
            renderHistoryList();
        }

        // History Render & Delete
        function renderHistoryList() {
            const container = document.getElementById('historyListContainer');
            if (!container) return;
            const query = (document.getElementById('historySearchInput')?.value || '').toLowerCase().trim();

            const filtered = historyRecords.filter(rec => {
                if (!query) return true;
                const matchTruck = rec.truckName.toLowerCase().includes(query);
                const matchDriver = (rec.driverName || '').toLowerCase().includes(query);
                const matchDate = rec.timestamp.toLowerCase().includes(query);
                const matchItems = rec.items.some(i => i.name.toLowerCase().includes(query));
                return matchTruck || matchDriver || matchDate || matchItems;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-8 text-slate-500 text-xs font-medium">
                        <i class="fa-solid fa-clipboard-list text-3xl mb-2 block opacity-40"></i>
                        ${query ? '該当する履歴が見つかりません' : '保存された作業履歴はありません'}

                return;
            }

            container.innerHTML = filtered.map(rec => `
                <div class="bg-slate-900 border ${rec.isOverloaded ? 'border-rose-600/70' : 'border-slate-700'} rounded-xl p-3.5 space-y-2">

                        <div>
                            <span class="text-[10px] text-slate-400 font-mono block">${escapeHtml(rec.timestamp)}</span>

                            </h4>
                            <span class="text-xs text-slate-300 font-semibold flex items-center gap-1 mt-0.5">
                                <i class="fa-solid fa-user text-slate-400 text-[10px]"></i> 担当: ${escapeHtml(rec.driverName || '未指定')}
                            </span>
                        </div>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${rec.isOverloaded ? 'bg-rose-950 text-rose-400 border border-rose-800' : 'bg-emerald-950 text-emerald-400 border border-emerald-800'}">

        // CSV Export Function
        function exportHistoryCSV() {
            if (historyRecords.length === 0) {
                showCustomModal('出力エラー', '出力する作業履歴がありません。', 'fa-circle-info', 'text-amber-400');
                return;
            }

            let csvContent = '\uFEFF'; // BOM for UTF-8 Excel support
            csvContent += '日時,トラック名,ナンバー,担当者,最大積載量(kg),最終積載量(kg),積載率(%),過積載判定,荷物名,単体重量(kg),数量,小計重量(kg)\n';

            historyRecords.forEach(rec => {
                const status = rec.isOverloaded ? '過積載' : '正常';
                rec.items.forEach(item => {
                    const line = [
                        `"${rec.timestamp}"`,
                        `"${rec.truckName.replace(/"/g, '""')}"`,
                        `"${rec.truckPlate.replace(/"/g, '""')}"`,
                        `"${(rec.driverName || '').replace(/"/g, '""')}"`,
                        rec.maxWeight,
                        rec.totalWeight,
                        rec.loadRate,
                        `"${status}"`,
                        `"${item.name.replace(/"/g, '""')}"`,
                        item.unitWeight,
                        item.count,
                        item.totalWeight
                    ].join(',');
                    csvContent += line + '\n';
                });
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `積載記録_${new Date().toISOString().slice(0, 10)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Custom Modal Control
        function showCustomModal(title, messageHtml, iconClass, iconColor) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').innerHTML = messageHtml;
            const iconEl = document.getElementById('modalIcon');
            iconEl.className = `fa-solid ${iconClass} ${iconColor}`;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
